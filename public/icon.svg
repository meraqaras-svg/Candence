<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Obsidian Glass Base -->
    <radialGradient id="nyxonBg" cx="25%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#18182a" />
      <stop offset="55%" stop-color="#0b0b12" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Liquid Glass Specular Frame -->
    <linearGradient id="nyxonGlassFrame" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="28%" stop-color="#a78bfa" stop-opacity="0.18" />
      <stop offset="68%" stop-color="#22d3ee" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <!-- Ambient Refraction Aura -->
    <radialGradient id="nyxonAura" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome-to-Violet-to-Cyan Prism Left Pillar -->
    <linearGradient id="nyxonPillarLeft" x1="126" y1="114" x2="188" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="42%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Diagonal Refraction Blade -->
    <linearGradient id="nyxonPrismDiag" x1="142" y1="118" x2="372" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="32%" stop-color="#a78bfa" />
      <stop offset="68%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Chrome-to-Cyan Right Pillar -->
    <linearGradient id="nyxonPillarRight" x1="328" y1="114" x2="392" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="48%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Top Edge Specular Glint -->
    <linearGradient id="nyxonTopGlint" x1="110" y1="36" x2="402" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="nyxonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#nyxonBg)" />
  <rect width="512" height="512" rx="116" fill="url(#nyxonAura)" />

  <!-- Subtle Inner Specular Glass Layer -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="#ffffff" fill-opacity="0.03" stroke="url(#nyxonGlassFrame)" stroke-width="3" />
  <line x1="128" y1="29.5" x2="384" y2="29.5" stroke="url(#nyxonTopGlint)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Acoustic Wave Arcs (subtle geometric echo behind the N prism) -->
  <g opacity="0.28" stroke-linecap="round" fill="none">
    <path d="M92 212 C78 240 78 272 92 300" stroke="#c4b5fd" stroke-width="6" />
    <path d="M420 212 C434 240 434 272 420 300" stroke="#38bdf8" stroke-width="6" />
  </g>

  <!-- Luminous Geometric N Prism Monogram -->
  <g filter="url(#nyxonGlow)">
    <!-- Left Vertical Prism Facet -->
    <path d="M132 390 L132 136 C132 124 142 114 154 114 L182 114 L182 368 C182 380 172 390 160 390 Z" fill="url(#nyxonPillarLeft)" />

    <!-- Right Vertical Prism Facet -->
    <path d="M330 144 C330 132 340 122 352 122 L380 122 L380 376 C380 388 370 398 358 398 L330 398 Z" fill="url(#nyxonPillarRight)" />

    <!-- Diagonal Refraction Ribbon + Acoustic Wave Cut -->
    <path d="M138 118 C144 114 154 114 166 114 L188 114 L374 374 C381 384 374 398 361 398 L332 398 L138 128 Z" fill="url(#nyxonPrismDiag)" />

    <!-- Crisp Specular Edge Highlight on Diagonal -->
    <path d="M174 126 L354 378" stroke="#ffffff" stroke-opacity="0.72" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
